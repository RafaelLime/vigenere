[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vigenere"
version = "1.0.0"
description = "A Vigenère cipher encoder/decoder with a command-line interface."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
vigenere = "vigenere.cli:main"

[tool.setuptools.packages.find]
include = ["vigenere*"]
